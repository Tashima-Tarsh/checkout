[build]
builder = "nixpacks"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10

[[services]]
name = "checkout-api"
source = "."
dockerfile = "Dockerfile"

[[services]]
name = "agentic-pay"
source = "."
dockerfile = "Dockerfile.agentic"
