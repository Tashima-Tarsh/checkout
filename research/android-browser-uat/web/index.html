<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agentic Pay — Synthetic UAT</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#f7f7fa;background:#101116}body{min-height:100dvh;display:grid;place-items:center;padding:12px;isolation:isolate}.canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}.panel{width:min(100%,375px);border:1px solid #41434e;background:#191a22f5;border-radius:22px;padding:clamp(16px,4vh,28px);box-shadow:0 22px 65px #0009;text-align:center;backdrop-filter:blur(12px)}.brand{font-size:45px;font-weight:900;letter-spacing:-2.5px;color:#ff7585;line-height:1.1}.sub{font-size:18px;letter-spacing:2px;margin-top:5px}.agent{font-size:10px;letter-spacing:1.5px;color:#aaa9b5;margin:16px 0 22px;display:flex;align-items:center;justify-content:center;gap:7px}.led{width:7px;height:7px;border-radius:50%;background:#4ee0a0;box-shadow:0 0 10px #4ee0a0;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.4}}h2{font-size:23px;letter-spacing:-.8px;margin:10px 0}p{font-size:13px;line-height:1.6;color:#b0afbd;margin:8px 0 18px}button{width:100%;border:0;border-radius:10px;padding:14px;font:600 14px system-ui;color:white;cursor:pointer;margin:5px 0;transition:transform .2s,filter .2s}button:hover{filter:brightness(1.12)}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid white;outline-offset:3px}.primary{background:linear-gradient(105deg,#ea4b70,#fb795b);box-shadow:0 6px 22px #f3575630}.secondary{background:#24252e;border:1px solid #43444f}.footer{border-top:1px solid #ffffff12;margin-top:20px;padding-top:13px;font-size:9px;letter-spacing:1px;color:#9695a3}.steps{display:flex;align-items:center;justify-content:center;margin:20px 0 4px;gap:5px}.steps i{width:8px;height:8px;border-radius:50%;background:#555360}.steps b{width:24px;height:1px;background:#555360}.steps .active{background:#ff7380;box-shadow:0 0 10px #ff738077}.entry{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.track{height:4px;background:#393842;border-radius:10px;overflow:hidden;margin:20px 0}.fill{height:100%;background:linear-gradient(90deg,#fc667e,#ffab67,#59d9ad);animation:fill 10s linear forwards}@keyframes fill{from{width:0}to{width:100%}}.counter{font-size:46px;font-weight:750;font-variant-numeric:tabular-nums;margin:15px 0}.wire{fill:none;stroke:#53505e;stroke-width:1.7}.signal{fill:none;stroke-width:2.5;stroke-dasharray:9 145;animation:signal 5s linear infinite}@keyframes signal{to{stroke-dashoffset:-308}}.node{fill:#202129;stroke:#62606e}.notice{min-height:18px;font-size:11px;color:#ffb5ae;margin:4px 0}.mobile{display:none}@media(max-width:600px){.desktop{display:none}.mobile{display:block}.panel{max-width:355px}}@media(min-width:768px){.panel{max-width:375px}}@media(max-height:480px){.panel{padding:12px}.brand{font-size:32px}.agent,.steps,.footer{margin:8px 0}.footer{padding-top:7px}p{margin:4px 0 8px}button{padding:10px;margin:3px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
