<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>N8N — Agentic Pay</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#f7f7fa;background:#101116}body{min-height:100dvh;display:grid;place-items:center;padding:12px;isolation:isolate}.canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}.panel{width:min(100%,375px);border:1px solid #41434e;background:#191a22f5;border-radius:22px;padding:clamp(16px,4vh,28px);box-shadow:0 22px 65px #0009;text-align:center;backdrop-filter:blur(12px)}.brand{font-size:45px;font-weight:900;letter-spacing:-2.5px;color:#ff7585;line-height:1.1}.sub{font-size:18px;letter-spacing:2px;margin-top:5px}.agent{font-size:10px;letter-spacing:1.5px;color:#aaa9b5;margin:16px 0 22px;display:flex;align-items:center;justify-content:center;gap:7px}.led{width:7px;height:7px;border-radius:50%;background:#4ee0a0;box-shadow:0 0 10px #4ee0a0;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.4}}h2{font-size:23px;letter-spacing:-.8px;margin:10px 0}p{font-size:13px;line-height:1.6;color:#b0afbd;margin:8px 0 18px}button{width:100%;border:0;border-radius:10px;padding:14px;font:600 14px system-ui;color:white;cursor:pointer;margin:5px 0;transition:transform .2s,filter .2s}button:hover{filter:brightness(1.12)}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid white;outline-offset:3px}.primary{background:linear-gradient(105deg,#ea4b70,#fb795b);box-shadow:0 6px 22px #f3575630}.secondary{background:#24252e;border:1px solid #43444f}.footer{border-top:1px solid #ffffff12;margin-top:20px;padding-top:13px;font-size:9px;letter-spacing:1px;color:#9695a3}.steps{display:flex;align-items:center;justify-content:center;margin:20px 0 4px;gap:5px}.steps i{width:8px;height:8px;border-radius:50%;background:#555360}.steps b{width:24px;height:1px;background:#555360}.steps .active{background:#ff7380;box-shadow:0 0 10px #ff738077}.entry{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.digits{width:100%;height:56px;background:#111218;border:1px solid #51505d;border-radius:10px;color:white;font-size:28px;text-align:center;letter-spacing:.5em;padding-left:.5em;margin:8px 0;outline:none}.digits:focus{border-color:#ff7585;box-shadow:0 0 0 3px #ff75851c}.track{height:4px;background:#393842;border-radius:10px;overflow:hidden;margin:20px 0}.fill{height:100%;background:linear-gradient(90deg,#fc667e,#ffab67,#59d9ad);animation:fill 10s linear forwards}@keyframes fill{from{width:0}to{width:100%}}.counter{font-size:46px;font-weight:750;font-variant-numeric:tabular-nums;margin:15px 0}.wire{fill:none;stroke:#53505e;stroke-width:1.7}.signal{fill:none;stroke-width:2.5;stroke-dasharray:9 145;animation:signal 5s linear infinite}@keyframes signal{to{stroke-dashoffset:-308}}.node{fill:#202129;stroke:#62606e}.notice{min-height:18px;font-size:11px;color:#ffb5ae;margin:4px 0}.mobile{display:none}@media(max-width:600px){.desktop{display:none}.mobile{display:block}.panel{max-width:355px}}@media(min-width:768px){.panel{max-width:375px}}@media(max-height:480px){.panel{padding:12px}.brand{font-size:32px}.agent,.steps,.footer{margin:8px 0}.footer{padding-top:7px}p{margin:4px 0 8px}button{padding:10px;margin:3px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><svg class="canvas desktop" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff18"/></pattern></defs><rect width="1000" height="650" fill="url(#dots)"/><g id="network"></g></svg><svg class="canvas mobile" viewBox="0 0 400 850" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="mdots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff18"/></pattern></defs><rect width="400" height="850" fill="url(#mdots)"/><g id="mobileNetwork"></g></svg><main class="panel"><div class="brand">N8N</div><div class="sub">Agentic Pay</div><div class="agent"><span class="led"></span> AGENT VERIFICATION</div><div id="stage"></div><div class="footer">N8N · AGENTIC PAYMENT EXPERIENCE<br><br>Interactive checkout preview</div></main><script>
const UPI_ID = ''; // Configure receiving UPI ID here later. Never put credentials here.
const stage=document.querySelector('#stage');let timer;const colors=['#ff7085','#aa8afb','#54d6a6','#efb460','#6baaff'];function network(id,nodes,paths){document.getElementById(id).innerHTML=paths.map((d,i)=>`<path class="wire" d="${d}"/><path class="signal" stroke="${colors[i%5]}" style="animation-delay:-${i%5}s" d="${d}"/>`).join('')+nodes.map(([x,y,label,mark],i)=>`<g transform="translate(${x} ${y})"><rect class="node" width="84" height="70" rx="10"/><rect x="27" y="10" width="30" height="30" rx="7" fill="${colors[i%5]}22"/><text x="42" y="32" fill="${colors[i%5]}" font-size="19" text-anchor="middle">${mark}</text><text x="42" y="56" fill="#aaa9b5" font-size="10" text-anchor="middle">${label}</text><circle cx="0" cy="35" r="3" fill="#9995a4"/><circle cx="84" cy="35" r="3" fill="#9995a4"/></g>`).join('')}
network('network',[[80,115,'Trigger','↯'],[270,40,'Session','▤'],[80,440,'Data store','▱'],[836,115,'Lookup','⌕'],[836,440,'Verify','✓'],[458,550,'Process','▤']],['M164 150H220Q240 150 240 170V280H400','M164 150H200V75H270','M354 75H740V150H836','M164 475H240V370H400','M600 280H760V150H836','M600 370H760V475H836','M164 475H220V585H458','M542 585H780V475H836','M878 185V440']);network('mobileNetwork',[[18,55,'Trigger','↯'],[285,100,'Session','▤'],[18,710,'Lookup','⌕'],[285,755,'Verify','✓']],['M102 90H220V135H285','M60 125V360H180','M327 170V420H220','M60 710V530H180','M102 745H220V790H285','M327 755V530H220']);
function steps(n){return `<div class="steps" aria-hidden="true"><i class="${n>=1?'active':''}"></i><b></b><i class="${n>=2?'active':''}"></i><b></b><i class="${n>=3?'active':''}"></i></div>`}function home(){clearInterval(timer);stage.innerHTML=`<div class="entry"><h2>Pay with UPI</h2><p>Copy the UPI ID and complete your payment using any UPI app.</p><button class="primary" id="copy">Copy UPI &nbsp; ▢</button><button class="secondary" id="paid">I Have Paid &nbsp; →</button><div class="notice" role="status"></div>${steps(1)}</div>`;document.querySelector('#copy').onclick=async()=>{const n=stage.querySelector('.notice');if(!UPI_ID){n.textContent='UPI ID not configured yet.';return}try{await navigator.clipboard.writeText(UPI_ID);n.textContent='UPI ID copied.'}catch{n.textContent='Unable to copy. Please retry.'}};document.querySelector('#paid').onclick=confirmDigits}function confirmDigits(){stage.innerHTML=`<form class="entry"><h2>Confirm payment</h2><p>Enter the last 4 digits of the bank account you used to make this UPI payment.</p><input class="digits" aria-label="Last four digits of bank account" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" autocomplete="off" required><button class="primary" type="submit">Submit & Verify →</button><button class="secondary" type="button" id="back">Back</button>${steps(2)}</form>`;const input=stage.querySelector('input');input.oninput=()=>input.value=input.value.replace(/\D/g,'').slice(0,4);stage.querySelector('form').onsubmit=e=>{e.preventDefault();if(/^\d{4}$/.test(input.value))process()};stage.querySelector('#back').onclick=home}function process(){stage.innerHTML=`<div class="entry"><h2>Verifying payment</h2><div class="counter" id="count">10</div><p id="status" role="status">Initializing verification preview</p><div class="track"><div class="fill"></div></div>${steps(3)}</div>`;const end=Date.now()+10000;timer=setInterval(()=>{const t=Math.max(0,Math.ceil((end-Date.now())/1000));document.querySelector('#count').textContent=String(t).padStart(2,'0');document.querySelector('#status').textContent=t>6?'Simulating workflow execution':t>3?'Simulating transaction matching':'Awaiting result';if(!t){clearInterval(timer);stage.innerHTML=`<div class="entry"><h2>Verification pending</h2><p>Preview completed. Live verification is not connected.</p><button class="secondary" id="restart">Return to checkout</button>${steps(3)}</div>`;stage.querySelector('#restart').onclick=home}},200)}home();</script></body></html>
