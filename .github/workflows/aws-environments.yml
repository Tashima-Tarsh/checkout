name: AWS environment authentication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-environments.yml'
permissions:
  contents: read
  id-token: write
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::602322433189:role/DISHA8-2-GitHub-production
          aws-region: ap-southeast-2
          allowed-account-ids: '602322433189'
      - run: aws sts get-caller-identity
