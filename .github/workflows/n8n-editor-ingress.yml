name: n8n editor ingress
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ingress:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build n8n image
        run: docker build -f Dockerfile.n8n -t agentic-n8n-ci .
      - name: Verify private listener and payment route blocking
        run: |
          docker run --rm -i --entrypoint /bin/sh agentic-n8n-ci -s <<'SH'
          set -eu
          cloudflared --version
          sed -n "/<<'CADDY'/,/^CADDY$/p" /opt/agentic-pay/editor-ingress.sh | sed '1d;$d' > /tmp/Caddyfile
          caddy validate --config /tmp/Caddyfile --adapter caddyfile
          node -e 'require("node:http").createServer((req,res)=>res.end("editor")).listen(5678,"127.0.0.1")' &
          caddy run --config /tmp/Caddyfile --adapter caddyfile &
          sleep 2
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const origin = "http://127.0.0.1:5680";
          for (const path of ["/webhook/agentic-pay-dispatch", "/webhook-test/example", "/webhook-waiting/x", "/form/x", "/mcp/x", "/%77ebhook/x"]) {
            assert.equal((await fetch(origin + path)).status, 404, path);
          }
          assert.equal(await (await fetch(origin + "/setup")).text(), "editor");
          await assert.rejects(fetch("http://" + Object.values((await import("node:os")).networkInterfaces()).flat().find(ip => !ip.internal && ip.family === "IPv4").address + ":5680"));
          JS
          SH
