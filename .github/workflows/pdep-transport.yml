name: PDEP transport lab
on: [pull_request]
permissions:
  contents: read
jobs:
  transport-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/pdep_transport.spec.mjs
