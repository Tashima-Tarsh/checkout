name: Android receiver startup validation and APK build
on:
  push:
    branches: [fix/android-receiver-startup-v2.1, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove invalid unused wrapper from build workspace
        run: rm -f recovery-agent/android/gradle/wrapper/gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        working-directory: recovery-agent/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and launcher
        run: |
          APK=recovery-agent/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "launchable-activity: name='com.agentic.pay.connectivitytest.MainActivity'" apk-badging.txt
          sha256sum "$APK" > apk-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and validate runtime startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash recovery-agent/android/ci-startup.sh
      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: agentic-pay-receiver-apk
          path: |
            recovery-agent/android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logs
          path: |
            apk-badging.txt
            startup-logcat.txt
          if-no-files-found: warn
