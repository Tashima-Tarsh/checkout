name: Android receiver startup validation and APK build

on:
  push:
    branches: [fix/android-receiver-startup-v2.1, main]
  pull_request:
    branches: [fix/android-receiver-startup-v2.1, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Validate Gradle wrapper
        run: |
          cd recovery-agent/android
          ./gradlew --version

      - name: Build debug APK
        working-directory: recovery-agent/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists and compute SHA-256
        run: |
          APK_PATH=$(find recovery-agent/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV
          ls -la "$APK_PATH"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          avd-name: test-avd
          force-avd-creation: true
          disable-animations: true
          hardware-profile: pixel_6
          channel: stable

      - name: Install APK on emulator
        run: |
          adb install -r -t ${{ env.APK_PATH }}

      - name: Launch MainActivity and verify startup
        run: |
          adb shell am start -W -n com.agentic.pay.connectivitytest/.MainActivity
          sleep 5
          adb shell dumpsys activity activities | grep -E "mResumedActivity|com.agentic.pay.connectivitytest"

      - name: Check Logcat for fatal exceptions
        run: |
          adb logcat -d -t 100 | grep -iE "FATAL|Exception|ActivityNotFound|ClassNotFound|RuntimeException" || echo "No fatal exceptions found"
          adb logcat -c

      - name: Verify enrollment screen is accessible
        run: |
          adb shell input keyevent KEYCODE_BACK
          sleep 2
          adb shell am start -n com.agentic.pay.connectivitytest/.PairingActivity
          sleep 3
          adb shell dumpsys activity activities | grep -E "PairingActivity|com.agentic.pay.connectivitytest"

      - name: Test application relaunch
        run: |
          adb shell am force-stop com.agentic.pay.connectivitytest
          sleep 2
          adb shell am start -W -n com.agentic.pay.connectivitytest/.MainActivity
          sleep 5
          adb shell dumpsys activity activities | grep -E "mResumedActivity|com.agentic.pay.connectivitytest"

      - name: Check Logcat after relaunch for fatal exceptions
        run: |
          adb logcat -d -t 100 | grep -iE "FATAL|Exception|ActivityNotFound|ClassNotFound|RuntimeException" || echo "No fatal exceptions found after relaunch"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-pay-receiver-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Upload startup logs
        uses: actions/upload-artifact@v4
        with:
          name: startup-logs
          path: |
            recovery-agent/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
