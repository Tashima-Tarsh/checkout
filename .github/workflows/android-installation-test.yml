name: Android connectivity test APK
on:
  push:
    branches: [test/agentic-android-installation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build test APK
        working-directory: recovery-agent/android
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticPay-connectivity-test
          path: recovery-agent/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
