name: Android device integration test and APK build

on:
  pull_request:
  push:
    branches: [test/agentic-android-installation, main]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Validate Gradle wrapper
        run: |
          cd recovery-agent/android
          ./gradlew --version

      - name: Build debug APK
        run: |
          cd recovery-agent/android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists and compute SHA-256
        run: |
          APK_PATH=$(find recovery-agent/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV
          ls -la "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-pay-receiver-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenticpay
          POSTGRES_PASSWORD: agenticpay-ci-fixture
          POSTGRES_DB: agenticpay
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      AGENTIC_DATABASE_URL: postgresql://agenticpay:agenticpay-ci-fixture@127.0.0.1:5432/agenticpay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q tests/

      - name: Run device enrollment tests
        run: python -m pytest -q tests/test_agentic_device_enrollment.py

      - name: Run replay tests on PostgreSQL
        run: AP_REPLAY_POSTGRES=1 python -m pytest -q tests/test_agentic_replay.py
