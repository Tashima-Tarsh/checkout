name: Agentic vision gate research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install Pillow==11.2.1 pytest
      - run: python -m pytest -q tests/test_agentic_vision.py
      - run: node --check checkout/agentic_assets/vision.js
