name: Agentic Pay isolation and orchestration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  agentic-pay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenticpay
          POSTGRES_PASSWORD: agenticpay-ci-fixture
          POSTGRES_DB: agenticpay
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      AGENTIC_DATABASE_URL: postgresql://agenticpay:agenticpay-ci-fixture@127.0.0.1:5432/agenticpay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_agentic_registration_privacy.py
      - name: Prove legacy connection rejected before any Agentic Pay DDL
        run: |
          python - <<'PY'
          from sqlalchemy import inspect, text
          from checkout.agentic_storage import initialize, make_engine

          engine = make_engine()
          with engine.begin() as conn:
              conn.execute(text("CREATE TABLE checkout_isolation_sentinel (id integer)"))
          try:
              initialize(engine)
          except RuntimeError as exc:
              assert str(exc) == "Legacy checkout objects found in Agentic Pay database"
          else:
              raise AssertionError("Legacy migration guard did not run")
          with engine.begin() as conn:
              assert inspect(conn).get_table_names() == ["checkout_isolation_sentinel"]
              conn.execute(text("DROP TABLE checkout_isolation_sentinel"))
          PY
      - run: docker build -f Dockerfile.agentic -t agentic-pay:ci .
      - name: Start the isolated image and check the clean database
        run: |
          export AGENTIC_OWNER_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
          export AGENTIC_ACCOUNT_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')"
          docker run -d --network host -e AGENTIC_DATABASE_URL -e AGENTIC_OWNER_TOKEN -e AGENTIC_ACCOUNT_KEY --name agentic-pay agentic-pay:ci
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/healthz
          for path in / /merchant /owner /agents /api; do
            curl -fsS "http://127.0.0.1:8080$path" >/dev/null
          done
          python - <<'PY'
          from sqlalchemy import func, select
          from checkout.agentic_storage import accounts, agent_sessions, make_engine, merchants, orders

          with make_engine().connect() as conn:
              for table in (merchants, accounts, orders, agent_sessions):
                  assert conn.scalar(select(func.count()).select_from(table)) == 0
          PY
      - if: failure()
        run: docker logs agentic-pay || true
