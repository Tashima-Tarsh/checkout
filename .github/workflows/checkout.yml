name: Checkout verification
on:
  pull_request:
  push:
    branches: [main, pdep-railway-refactor]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: checkout
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U checkout" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://checkout:ci-only@127.0.0.1:5432/checkout
      PDEP_TEST_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: python research/run_experiments.py
      - run: node --test research/*.spec.mjs
      - run: docker build -t pdep-checkout:test .
      - run: docker run --detach --network host --env DATABASE_URL --name pdep pdep-checkout:test
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python research/browser_signal_lab.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-signal-capabilities
          path: browser-signal-lab.json
          if-no-files-found: warn
      - if: failure()
        run: docker inspect pdep >/dev/null 2>&1 && docker logs pdep || true
