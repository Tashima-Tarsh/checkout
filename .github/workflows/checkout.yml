name: Checkout verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: checkout
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U checkout" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://checkout:ci-only@127.0.0.1:5432/checkout
      PDEP_TEST_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Assert legacy migration does not create Agentic Pay tables
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from checkout.storage import make_engine
          engine = make_engine()
          try:
              assert not any(name.startswith('ap_') for name in inspect(engine).get_table_names()), 'Agentic Pay tables leaked into legacy database'
          finally:
              engine.dispose()
          PY
      - run: python -m pytest -q
      - run: python research/run_experiments.py
      - run: node --test research/*.spec.mjs
      - run: docker build -t pdep-checkout:test .
      - run: docker run --detach --network host --env DATABASE_URL --name pdep pdep-checkout:test
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
      - name: Run browser smoke and research checks
        timeout-minutes: 8
        run: |
          docker run --rm --init --ipc host --network host \
            -v "$PWD:/workspace" -w /workspace \
            mcr.microsoft.com/playwright/python:v1.52.0-noble \
            sh -ec 'python -m pip install --no-cache-dir playwright==1.52.0
                     python tests/browser_smoke.py
                     python research/browser_signal_lab.py
                     python research/visibility_observation_lab.py
                     python research/opaque_fetch_lab.py'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-signal-capabilities
          path: |
            browser-signal-lab.json
            browser-visibility-negative-control.json
          if-no-files-found: warn
      - if: failure()
        run: docker inspect pdep >/dev/null 2>&1 && docker logs pdep || true
