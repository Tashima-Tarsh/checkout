name: TLSNotary protocol experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tlsn-protocol-experiment.yml'
permissions:
  contents: read
jobs:
  attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build pinned upstream reference implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.0-alpha.14 https://github.com/tlsnotary/tlsn.git "$RUNNER_TEMP/tlsn"
          cd "$RUNNER_TEMP/tlsn"
          rustup update stable
          cargo build --locked --release --bin tlsn-server-fixture
          cargo build --locked --release --example attestation_prove --example attestation_present --example attestation_verify
      - name: Generate, present and verify an actual TLS attestation against the upstream local test server
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tlsn"
          export RUST_LOG=warn PORT=4000 SERVER_PORT=4000
          target/release/tlsn-server-fixture > "$RUNNER_TEMP/tlsn-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time
          for _ in range(100):
              try:
                  with socket.create_connection(("127.0.0.1",4000), timeout=0.5):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("Fixture did not become reachable")
          PY
          start=$(date +%s%3N)
          timeout 120 target/release/examples/attestation_prove
          timeout 30 target/release/examples/attestation_present
          timeout 30 target/release/examples/attestation_verify
          elapsed=$(( $(date +%s%3N) - start ))
          test -s example-json.presentation.tlsn
          printf 'Upstream local fixture proof round trip: %s ms (build excluded)\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed >= 120000 )); then
            echo 'Local proof round trip exceeded the target window.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Non-financial fixture only; no MyUPI, mobile browser, checkout or actual debit validation.' >> "$GITHUB_STEP_SUMMARY"
