name: PDEP browser signature negative control
on: [pull_request]
permissions:
  contents: read
jobs:
  negative-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/browser_signature.spec.mjs
