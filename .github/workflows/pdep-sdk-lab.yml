name: PDEP synthetic SDK lab
on: [pull_request]
permissions:
  contents: read
jobs:
  sdk-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/controlled_handshake.spec.mjs research/evidence_lab.spec.mjs research/return_tracker.spec.mjs
