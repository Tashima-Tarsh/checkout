name: PDEP local diagnostic research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/local_diagnostics.spec.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python research/local_diagnostics_browser.py
