name: Public production availability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ops/production_probe.py
      - .github/workflows/production-probe.yml
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  validate-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate probe source and command line
        run: |
          python -m py_compile ops/production_probe.py
          python ops/production_probe.py --help

  verify-public-checkout:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe real public domain (no payment initiation)
        run: python ops/production_probe.py
      - name: Attach exact DNS / HTTP failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-production-health
          path: production-probe.json
          if-no-files-found: warn
          retention-days: 7
