name: Public production availability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ops/production_probe.py
      - .github/workflows/production-probe.yml
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  verify-public-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe real public domain (no payment initiation)
        run: python ops/production_probe.py
      - name: Attach exact DNS / HTTP failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-production-health
          path: production-probe.json
          if-no-files-found: warn
          retention-days: 7

  verify-public-agentic-pay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Agentic Pay public health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 https://agenticpay.thenitishkr.in/healthz | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data.get("ok") is True, data; print("Agentic Pay health: ok")'
