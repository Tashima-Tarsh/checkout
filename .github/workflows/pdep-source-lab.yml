name: PDEP source research
on: [pull_request]
permissions:
  contents: read
jobs:
  source-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/pdep_source_lab.spec.mjs research/split_screen_pixel_probe.spec.mjs
