<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic Pay</title><link rel="stylesheet" href="/assets/portal.css"><script src="/assets/portal.js" defer></script></head>
<body><header><strong>Agentic Pay</strong><nav><a href="/merchant">Merchant</a><a href="/owner">Owner</a><a href="/agents">Agents</a></nav></header>
<main><h1 id="heading">Agentic Pay</h1><p id="intro">Manage UPI accounts, checkout links and payment verification.</p>
<form id="sign-in" hidden><label>Access token<input name="token" type="password" required autocomplete="off"></label><button>Open workspace</button></form>
<p id="status" role="status"></p><section id="workspace" hidden>
<button id="logout" type="button">Sign out</button>
<section id="owner" hidden><h2>Merchants</h2><form id="new-merchant"><label>Merchant name<input name="name" minlength="3" maxlength="150" required></label><button>Create merchant</button></form><output id="new-token"></output><ul id="merchants"></ul></section>
<section id="merchant" hidden><h2>Receiving accounts</h2><form id="account"><label>UPI address<input name="upi_id" required></label><label>Account holder<input name="account_holder" required></label><label>Bank<input name="bank_name" required></label><label>Bank account number<input name="receiving_account_number" inputmode="numeric" required></label><label>Mobile number<input name="registered_mobile" inputmode="numeric" required></label><label>Account type<select name="account_type"><option>PERSONAL</option><option>MERCHANT</option></select></label><label>MCC<input name="mcc" inputmode="numeric"></label><button>Register account</button></form>
<form id="import"><label>Account CSV<input name="file" type="file" accept=".csv,text/csv" required></label><button>Import accounts</button></form><ul id="accounts"></ul>
<h2>Checkout links</h2><form id="new-order"><label>Amount (INR)<input name="amount" type="number" step=".01" min="1" required></label><label>Receiving account<select name="account_id" required></select></label><button>Create checkout</button></form><div id="checkout-link"></div><ul id="orders"></ul></section>
<section id="agents" hidden><h2>Account agents</h2><ul id="agent-list"></ul></section></section></main></body></html>
