<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Android Workspace - Agentic Pay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  .container { display: flex; flex-direction: column; height: 100%; }
  .header { background: #1a1a1a; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-badge.connected { background: #10b981; color: #fff; }
  .status-badge.disconnected { background: #ef4444; color: #fff; }
  .status-badge.connecting { background: #f59e0b; color: #fff; }
  .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .screen-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; overflow: hidden; }
  #android-screen { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; display: none; }
  .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .loading-spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 16px; font-size: 14px; color: #999; }
  .controls { display: flex; gap: 10px; padding: 16px; background: #1a1a1a; border-top: 1px solid #333; flex-shrink: 0; }
  .btn { flex: 1; padding: 10px 16px; background: #333; color: #fff; border: 1px solid #444; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { background: #444; }
  .btn:active { background: #555; }
  .btn.secondary { background: #2a2a2a; }
  .btn.secondary:hover { background: #3a3a3a; }
  .btn.full { background: #10b981; }
  .btn.full:hover { background: #059669; }
  .error-message { background: #ef4444; color: #fff; padding: 12px 16px; border-radius: 8px; margin: 16px; display: none; }
  .fullscreen-indicator { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px; font-size: 12px; opacity: 0.7; }
  /* Mobile-friendly touch targets */
  @media (max-width: 768px) {
    .controls { padding: 8px; gap: 6px; }
    .btn { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Android Workspace</h1>
    </div>
    <div>
      <span class="status-badge disconnected" id="statusBadge">
        <span class="dot"></span>
        <span id="statusText">Disconnected</span>
      </span>
    </div>
  </div>

  <div class="main">
    <div class="screen-container">
      <img id="android-screen" src="" alt="Android Screen">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Connecting to Android device...</div>
      </div>
      <div class="fullscreen-indicator" id="fullscreenIndicator" style="display:none;">Fullscreen Mode</div>
      <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="controls">
      <button class="btn secondary" onclick="sendInput('back')">⟵ Back</button>
      <button class="btn secondary" onclick="sendInput('home')">⌂ Home</button>
      <button class="btn secondary" onclick="sendInput('recent')">▭ Recent</button>
      <button class="btn full" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
  </div>
</div>

<script>
  const WS_URL = window.location.origin.replace(/^http/, 'ws') + '/android/ws/viewer';
  let ws = null;
  let img = document.getElementById('android-screen');
  let statusBadge = document.getElementById('statusBadge');
  let statusText = document.getElementById('statusText');
  let loadingOverlay = document.getElementById('loadingOverlay');
  let loadingText = document.getElementById('loadingText');
  let errorMessage = document.getElementById('errorMessage');
  let fullscreenIndicator = document.getElementById('fullscreenIndicator');
  let isFullscreen = false;

  function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      console.log('WebSocket connected');
      updateStatus('connected', 'Connected');
      loadingOverlay.style.display = 'none';
      img.style.display = 'block';
      ws.send(JSON.stringify({ type: 'get_status' }));
    };

    ws.onclose = () => {
      console.log('WebSocket disconnected');
      updateStatus('disconnected', 'Disconnected');
      loadingOverlay.style.display = 'flex';
      loadingText.textContent = 'Disconnected. Reconnecting...';
      img.style.display = 'none';
      setTimeout(connect, 3000);
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        switch (data.type) {
          case 'device_status':
            updateStatus(data.state === 'booted' ? 'connected' : 'connecting',
              data.state === 'booted' ? 'Connected' : data.state);
            break;
          case 'screen_frame':
            if (data.data) {
              img.src = 'data:image/jpeg;base64,' + data.data;
              img.style.display = 'block';
              loadingOverlay.style.display = 'none';
            }
            break;
          case 'error':
            showError(data.message);
            break;
        }
      } catch (e) {
        console.error('Failed to parse message:', e);
      }
    };

    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
      updateStatus('disconnected', 'Connection Error');
    };
  }

  function updateStatus(status, text) {
    statusBadge.className = 'status-badge ' + status;
    statusText.textContent = text;
  }

  function showError(msg) {
    errorMessage.textContent = msg;
    errorMessage.style.display = 'block';
    setTimeout(() => { errorMessage.style.display = 'none'; }, 5000);
  }

  function sendInput(action, extra = {}) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showError('Not connected to Android device');
      return;
    }
    ws.send(JSON.stringify({ type: 'inject_input', action, ...extra, timestamp: Date.now() }));
  }

  // Button handlers
  document.getElementById('android-screen').addEventListener('click', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const rect = img.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * img.naturalWidth;
    const y = ((e.clientY - rect.top) / rect.height) * img.naturalHeight;
    ws.send(JSON.stringify({
      type: 'inject_input',
      action: 'tap',
      x: Math.round(x),
      y: Math.round(y),
      timestamp: Date.now()
    }));
  });

  document.getElementById('android-screen').addEventListener('dblclick', (e) => {
    toggleFullscreen();
  });

  function toggleFullscreen() {
    const container = document.querySelector('.screen-container');
    if (!isFullscreen) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
      isFullscreen = true;
      fullscreenIndicator.style.display = 'block';
      setTimeout(() => { fullscreenIndicator.style.display = 'none'; }, 2000);
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      isFullscreen = false;
    }
  }

  document.addEventListener('fullscreenchange', () => {
    isFullscreen = !!document.fullscreenElement;
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && isFullscreen) {
      toggleFullscreen();
    }
    if (e.code === 'ArrowLeft') sendInput('back');
    if (e.code === 'ArrowRight') sendInput('home');
    if (e.code === 'ArrowUp') sendInput('recent');
  });

  // Initialize
  connect();
</script>
</body>
</html>
