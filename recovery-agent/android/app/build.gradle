android {
    namespace 'com.agentic.recovery.observer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.agentic.recovery.observer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Device enrollment: secure storage for device key pair
        // Enabled for Android Keystore hardware-backed key generation where supported
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
